<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Mismo azul oscuro de tu sistema */
            background-color: #2c3e50;
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .logo-container {
            /* Tamaño proporcional al original */
            width: 150px;
            height: 210px;
            margin-bottom: 20px;
            /* Para asegurar centrado interno */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- TRAZOS DEL LOGO --- */
        .utn-path {
            fill: none;
            stroke: #ecf0f1; /* BLANCO UNIFICADO PARA TODO */
            stroke-width: 40; /* Grosor original recuperado */
            stroke-linecap: butt; /* Bordes rectos como el logo real */

            /* Preparación para la animación */
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            animation: dibujar 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Secuencia de dibujado */
        .path-u-top { animation-delay: 0.2s; }     /* Arco Arriba */
        .path-u-bottom { animation-delay: 0.6s; }  /* Arco Abajo */
        .path-vertical { animation-delay: 1.0s; }  /* Pilar Central */
        .path-horizontal { animation-delay: 1.5s; } /* Barra Cruzada */

        /* --- TEXTOS --- */
        .text-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
            animation: subirTexto 0.8s ease-out forwards;
            animation-delay: 2.2s;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #bdc3c7;
            font-size: 14px;
            font-weight: 400;
            opacity: 0;
            transform: translateY(20px);
            animation: subirTexto 0.8s ease-out forwards;
            animation-delay: 2.5s;
        }

        /* --- KEYFRAMES --- */
        @keyframes dibujar {
            to { stroke-dashoffset: 0; }
        }

        @keyframes subirTexto {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="logo-container">
    <svg viewBox="0 0 250 350">

        <path class="utn-path path-u-top" d="M50,40 A70,70 0 0 0 190,40" />

        <path class="utn-path path-u-bottom" d="M50,280 A70,70 0 0 1 190,280" />

        <path class="utn-path path-vertical" d="M125,40 V280" />

        <path class="utn-path path-horizontal" d="M35,160 H215" />

    </svg>
</div>

<div class="text-container">
    <div class="title">UTN - FRC</div>
    <div class="subtitle">Cátedra de Diseño de Sistemas</div>
</div>

</body>
</html>
